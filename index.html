<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>おんかいチェッカー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      background-color: #eef7ff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 10px auto;
      background: white;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 20px;
    }
    
    #start-btn {
      font-size: 20px;
      padding: 14px 36px;
      background-color: #ff5252;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(255,82,82,0.3);
      transition: transform 0.1s ease;
      margin-bottom: 20px;
    }
    #start-btn:active {
      transform: scale(0.96);
    }

    /* 無段階スライダーエリア */
    .slider-box {
      background-color: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .slider-title {
      font-size: 14px;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }
    .slider-label {
      font-size: 15px;
      font-weight: bold;
      color: #2196f3;
      margin-bottom: 8px;
      min-height: 24px;
    }

    /* 先生用の数値確認表示 */
    .threshold-val-display {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .threshold-val-display span {
      color: #d32f2f;
      font-size: 15px;
    }

    input[type="range"] {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #ddd;
      outline: none;
      accent-color: #2196f3;
      cursor: pointer;
    }
    .slider-scale {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      font-weight: bold;
    }

    #note-display {
      font-size: 64px;
      font-weight: bold;
      margin: 20px 0;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbbbbb;
    }
    
    #detail-display {
      font-size: 18px;
      color: #666;
      min-height: 30px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>おんかいチェッカー 🎵</h1>
    
    <button id="start-btn" onclick="toggleAudio()">マイク スタート</button>

    <!-- 無段階スライダーエリア -->
    <div class="slider-box">
      <div class="slider-title">ひろう おとの はんい</div>
      <div id="slider-value-text" class="slider-label">🏫 ふつう（きょうしつ・かんしょう）</div>
      
      <!-- 先生確認用の数値（閾値）表示 -->
      <div class="threshold-val-display">（しきい値: <span id="threshold-num">0.05</span>）</div>

      <!-- グラスの音を拾いやすいよう初期値を0.05に設定 -->
      <input type="range" id="sensitivity-slider" min="0.01" max="0.30" step="0.01" value="0.05" oninput="updateSensitivity(this.value)">
      
      <div class="slider-scale">
        <span>📢 とおく</span>
        <span>📱 めっちゃちかく</span>
      </div>
    </div>

    <div id="note-display">--</div>
    <div id="detail-display">ボタンをおして声をだしてみてね！</div>
  </div>

  <script>
    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let animationId = null;

    // 音量しきい値（グラスなどの短発音向けに初期値を 0.05 に変更）
    let sensitivityThreshold = 0.05;

    // ブレ防止用変数
    let lastNoteIndex = -1;
    let noteHoldCount = 0;

    // 音名データ（小学3年生向け）
    const noteData = [
      { name: "ド", color: "#e53935", sub: "ひくい ド" },
      { name: "ド と レ の あいだ", color: "#d81b60", sub: "（ちょっとたかい ド）" },
      { name: "レ", color: "#fb8c00", sub: "レ" },
      { name: "レ と ミ の あいだ", color: "#fdd835", sub: "（ちょっとたかい レ）" },
      { name: "ミ", color: "#7cb342", sub: "ミ" },
      { name: "ファ", color: "#43a047", sub: "ファ" },
      { name: "ファ と ソ の あいだ", color: "#00acc1", sub: "（ちょっとたかい ファ）" },
      { name: "ソ", color: "#1e88e5", sub: "ソ" },
      { name: "ソ と ラ の あいだ", color: "#3949ab", sub: "（ちょっとたかい ソ）" },
      { name: "ラ", color: "#8e24aa", sub: "ラ" },
      { name: "ラ と シ の あいだ", color: "#e91e63", sub: "（ちょっとたかい ラ）" },
      { name: "シ", color: "#f06292", sub: "シ" }
    ];

    // スライダー変更時の挙動
    function updateSensitivity(val) {
      sensitivityThreshold = parseFloat(val);
      
      // 数値表示の更新
      document.getElementById("threshold-num").innerText = sensitivityThreshold.toFixed(2);
      
      const label = document.getElementById("slider-value-text");
      if (sensitivityThreshold >= 0.20) {
        label.innerText = "📱 めっちゃ ちかく（ぴったり ひっつける）";
      } else if (sensitivityThreshold >= 0.11) {
        label.innerText = "📱 ちかく（じぶんの おと だけ）";
      } else if (sensitivityThreshold >= 0.05) {
        label.innerText = "🏫 ふつう（きょうしつ・かんしょう）";
      } else {
        label.innerText = "📢 とおく（ひろく ひろう）";
      }
    }

    async function toggleAudio() {
      const btn = document.getElementById("start-btn");
      
      if (!isListening) {
        try {
          // 【対策1】ノイズキャンセリング等の自動カット処理を無効化
          const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: { 
              echoCancellation: false, 
              noiseSuppression: false,
              autoGainControl: false 
            } 
          });

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          isListening = true;
          btn.innerText = "ストップ";
          btn.style.backgroundColor = "#757575";
          detectPitch();

        } catch (err) {
          alert("マイクが許可されなかったか、取得できませんでした。\nブラウザのアドレスバーの［鍵マーク］からマイクを［許可］にしてください。");
        }
      } else {
        if (audioCtx) audioCtx.close();
        cancelAnimationFrame(animationId);
        isListening = false;
        btn.innerText = "マイク スタート";
        btn.style.backgroundColor = "#ff5252";
        document.getElementById("note-display").innerText = "--";
        document.getElementById("note-display").style.color = "#bbbbbb";
        document.getElementById("detail-display").innerText = "ボタンをおして声をだしてみてね！";
        
        lastNoteIndex = -1;
        noteHoldCount = 0;
      }
    }

    function detectPitch() {
      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);

      let rms = 0;
      for (let i = 0; i < buffer.length; i++) {
        rms += buffer[i] * buffer[i];
      }
      rms = Math.sqrt(rms / buffer.length);

      // 設定したしきい値以上の音だけ判定
      if (rms > sensitivityThreshold) {
        const pitch = autoCorrelate(buffer, audioCtx.sampleRate);
        
        if (pitch !== -1 && pitch > 80 && pitch < 2000) {
          const noteNum = Math.round(12 * (Math.log2(pitch / 440)) + 69);
          const noteIndex = (noteNum % 12 + 12) % 12;

          // 【対策2】保持カウントを 2 回（約0.03秒）に短縮し、瞬発的な音へ即座に反応
          if (noteIndex === lastNoteIndex) {
            noteHoldCount++;
            if (noteHoldCount >= 2) { 
              const info = noteData[noteIndex];
              const displayElem = document.getElementById("note-display");
              const detailElem = document.getElementById("detail-display");

              displayElem.innerText = info.name;
              displayElem.style.color = info.color;
              displayElem.style.fontSize = info.name.length > 3 ? "32px" : "72px";
              detailElem.innerText = info.sub;
            }
          } else {
            lastNoteIndex = noteIndex;
            noteHoldCount = 0;
          }
        }
      } else {
        noteHoldCount = 0;
      }

      if (isListening) {
        animationId = requestAnimationFrame(detectPitch);
      }
    }

    function autoCorrelate(buffer, sampleRate) {
      const SIZE = buffer.length;
      let c = new Float32Array(SIZE);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) {
          c[i] = c[i] + buffer[j] * buffer[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;

      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      if (T0 > 0) {
        return sampleRate / T0;
      }
      return -1;
    }
  </script>
</body>
</html>
